<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dynamic Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #content {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <!-- Links -->
    <a href="#" onclick="showContent('home')">Home</a> |
    <a href="#" onclick="showContent('about')">About</a> |
    <a href="#" onclick="showContent('contact')">Contact</a>

    <!-- Content Area -->
    <div id="content">
        <p>Welcome! Click a link above to see content here.</p>
    </div>

    <script>
        // Function to update content
        function showContent(page) {
            let contentDiv = document.getElementById('content');
            let content = '';

            if (page === 'home') {
                content = '<p>This is the <strong>Home</strong> page.</p>';
            } else if (page === 'about') {
                content = '<p>This is the <strong>About</strong> page.</p>';
            } else if (page === 'contact') {
                content = '<p>This is the <strong>Contact</strong> page.</p>';
            } else {
                content = '<p>Welcome! Click a link above to see content here.</p>';
            }

            contentDiv.innerHTML = content;
        }
    </script>

</body>
</html>
